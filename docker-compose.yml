# `docker compose up --build` runs the whole stack. `docker compose up -d redis`
# starts only Redis for local development (npm run dev on the host).
services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # development, not production, on purpose: production turns off schema
      # sync and there are no migrations yet, so a fresh DB would have no tables.
      NODE_ENV: development
      # Public placeholder, fine for a local run only. Set API_KEY in a root .env to change it.
      API_KEY: ${API_KEY:-replace-me-with-a-long-random-secret}
      REDIS_URL: redis://redis:6379
      DB_PATH: /data/payments.sqlite
      # Only matters if a browser calls :3000 directly; the UI goes through nginx.
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080},http://localhost:5173
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - backend-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  backend-data:
